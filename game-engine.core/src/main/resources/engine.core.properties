# Standalone defaults for the game engine library.
# Every engine.* property has an inline code default: consumers (e.g. game-engine.api)
# do NOT need this file and can override any value via their own configuration
# (application.yaml, environment, ...) using the same engine.* keys.

# db setting (used only by the standalone MongoConfig)
spring.data.mongodb.port=${MONGODB_PORT:50000}
spring.data.mongodb.database=${MONGODB_NAME:gamification-api-db}
spring.data.mongodb.username=${MONGODB_USER:username}
spring.data.mongodb.password=${MONGODB_PASSWORD:password}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

# trace player moves
engine.trace-player-move=${TRACE_PLAYER_MOVE:false}

# execution safety bounds (guard against runaway/looping rules)
# max-rule-firings: abort a single execution/simulation after this many rule firings (catches re-firing loops)
# timeout: wall-clock cap in ms for a single execution/simulation; frees the request thread when exceeded
# simulation-pool-size: bounded worker pool for simulations, fail-fast when saturated
engine.execution.max-rule-firings=${EXECUTION_MAX_RULE_FIRINGS:4000}
engine.execution.timeout=${EXECUTION_TIMEOUT_MS:120000}
engine.execution.simulation-pool-size=${EXECUTION_SIMULATION_POOL_SIZE:4}

# engine task schedules
engine.schedule.job-destroyer=${SCHEDULE_TASK_JOB_DESTROYER:0 0 0 * * *}
engine.schedule.check-performance-group-challenge=${SCHEDULE_TASK_CHECK_PERFORMANCE_GROUP_CHALLENGE:0 0 1 * * *}
engine.schedule.challenge-failure=${SCHEDULE_TASK_CHALLENGE_FAILURE:0 0 8 * * *}
engine.schedule.game-stats=${SCHEDULE_TASK_GAME_STATS:0 0 2 * * *}

# task persistence via JobRunr MongoDB storage (false = in-memory storage,
# recurring jobs are rebuilt from game definitions at startup).
# MongoDB storage requires the MongoClient to use uuidRepresentation=STANDARD
engine.task.persistence.activate=${TASK_PERSISTENCE_ACTIVATE:true}
engine.task.database-name=${JOBRUNR_STORAGE_DBNAME:gamification_task_store}

# JobRunr dashboard (http://localhost:${engine.task.dashboard.port})
engine.task.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:false}
engine.task.dashboard.port=${JOBRUNR_DASHBOARD_PORT:8000}

# RabbitMQ notifications (optional subsystem)
engine.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
engine.rabbitmq.png-exchange-name=${RABBITMQ_PNGEXCHANGENAME:ge-notifications}
engine.rabbitmq.png-routing-key-prefix=${RABBITMQ_PNGROUTINGKEYPREFIX:game}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:password}
spring.rabbitmq.username=${RABBITMQ_USER:user}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUALHOST:playgo}
