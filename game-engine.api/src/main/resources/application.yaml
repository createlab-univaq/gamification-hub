server:
  # Kept the same inside the container, on the host and in the Prometheus target,
  # so one address works whether the API runs from the IDE, from compose or on Coolify.
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  application:
    name: Gamification-API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mongodb:
    port: ${MONGODB_PORT:50000}
    database: ${MONGODB_NAME:gamification-api-db}
    username: ${MONGODB_USER:username}
    password: ${MONGODB_PASSWORD:password}
    authentication-database: admin
    representation:
      uuid: standard
    host: ${MONGODB_HOST:localhost}

  main:
    allow-circular-references: true
  data:
    mongodb:
      auto-index-creation: true

# stats: one structured line per game event | perf: one line per timed operation
# flip to INFO to enable; the engine.* Micrometer timers are always active regardless

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      # Publish histogram buckets for HTTP requests so Prometheus can compute
      # latency percentiles; without these only count/sum/max are exported.
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
