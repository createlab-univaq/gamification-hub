spring:
  application:
    name: Gamification-API
  profiles:
    active: test
  mongodb:
    port: ${MONGODB_PORT:50000}
    database: ${MONGODB_NAME:gamification-api-db}
    username: ${MONGODB_USER:username}
    password: ${MONGODB_PASSWORD:password}
    authentication-database: admin

  main:
    allow-circular-references: true
