services:
  prometheus:
    image: prom/prometheus:latest
    container_name: gamification-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_TARGETS:-./monitoring/prometheus/targets}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    container_name: gamification-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:latest
    command: run /etc/alloy/config.alloy
    volumes:
      - ./monitoring/grafana/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  gamification-api:
    container_name: "gamification-api"
    env_file:
      - game-engine.api/.env.prod
    build:
      dockerfile: game-engine.api/Dockerfile
    ports:
      - "18080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
