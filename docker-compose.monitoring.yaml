services:
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
      args:
        SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-5s}
        API_TARGET: ${API_TARGET:-host.docker.internal:8081}
    container_name: gamification-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    container_name: gamification-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:latest
    command: run /etc/alloy/config.alloy
    volumes:
      - ./monitoring/grafana/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
